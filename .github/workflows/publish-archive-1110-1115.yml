    steps:
      - name: Verify installers and publish archived Releases
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, urllib.request
          items = json.loads(os.environ["ARCHIVE_PAYLOAD"])
          repository = "tomsuhapbia/latex-studio"
          def api(endpoint, payload=None):
              command = ["gh", "api", "repos/" + repository + endpoint]
              if payload is not None:
                  command += ["--method", "POST", "--input", "-"]
              result = subprocess.run(command, input=json.dumps(payload) if payload is not None else None,
                                      text=True, capture_output=True)
              if result.returncode:
                  if payload is None and "404" in result.stderr:
                      return None
                  raise RuntimeError("GitHub API request failed for " + endpoint)
              return json.loads(result.stdout)
          latest = api("/releases/latest")["id"]
          for item in items:
              directory = pathlib.Path(item["tag"])
              directory.mkdir()
              installer = directory / item["name"]
              with urllib.request.urlopen(item["download_url"], timeout=120) as response:
                  installer.write_bytes(response.read())
              assert installer.stat().st_size == item["size"]
              assert hashlib.sha256(installer.read_bytes()).hexdigest() == item["sha256"]
              checksum = directory / "SHA256SUMS.txt"
              checksum.write_text(item["checksums"], encoding="utf-8")
              release = api("/releases/tags/" + item["tag"])
              if release is None:
                  release = api("/releases", {"tag_name": item["tag"], "target_commitish": "4b1f507e2a215bf3c8c52cd84e1f9612adad4c96",
                      "name": "LaTeX Studio " + item["version"] + " — Bản lưu trữ",
                      "body": item["notes"], "draft": True, "prerelease": False, "make_latest": "false"})
              for file in [installer, checksum]:
                  assets = api("/releases/" + str(release["id"]) + "/assets")
                  existing = next((a for a in assets if a["name"] == file.name), None)
                  digest = "sha256:" + hashlib.sha256(file.read_bytes()).hexdigest()
                  if existing:
                      assert existing["size"] == file.stat().st_size and existing.get("digest") == digest
                  else:
                      subprocess.run(["gh", "release", "upload", item["tag"], str(file), "--repo", repository], check=True)
                  assets = api("/releases/" + str(release["id"]) + "/assets")
                  uploaded = next(a for a in assets if a["name"] == file.name)
                  assert uploaded["state"] == "uploaded" and uploaded.get("digest") == digest
              if release["draft"]:
                  update = subprocess.run(["gh", "api", "repos/" + repository + "/releases/" + str(release["id"]),
                      "--method", "PATCH", "--input", "-"], input=json.dumps({"draft": False, "make_latest": "false"}),
                      text=True, capture_output=True)
                  assert update.returncode == 0
              print(item["tag"] + ": installer and checksum verified; Release published", flush=True)
          assert api("/releases/latest")["id"] == latest
          
