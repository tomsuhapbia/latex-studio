.1.0.exe) \u00b7 [T\u1ea3i checksum](https://github.com/tomsuhapbia/latex-studio/releases/download/v1.1.0/SHA256SUMS.txt)\n\n## Th\u00f4ng tin phi\u00ean b\u1ea3n\n\n- B\u1ed9 c\u00e0i g\u1ed1c mang s\u1ed1 phi\u00ean b\u1ea3n **1.1.0** trong th\u00f4ng tin ProductVersion c\u1ee7a EXE.\n- Gi\u1eef nguy\u00ean byte c\u1ee7a b\u1ed9 c\u00e0i \u0111\u00e3 l\u01b0u tr\u1eef; \u0111\u00e2y kh\u00f4ng ph\u1ea3i b\u1ea3n build l\u1ea1i t\u1eeb m\u00e3 ngu\u1ed3n hi\u1ec7n t\u1ea1i.\n- Ch\u01b0a c\u00f3 nh\u1eadt k\u00fd thay \u0111\u1ed5i ri\u00eang \u0111\u00e3 \u0111\u01b0\u1ee3c x\u00e1c nh\u1eadn cho phi\u00ean b\u1ea3n n\u00e0y. C\u00e1c thay \u0111\u1ed5i c\u1ee7a b\u1ea3n m\u1edbi h\u01a1n kh\u00f4ng \u0111\u01b0\u1ee3c g\u00e1n ng\u01b0\u1ee3c cho b\u1ea3n l\u01b0u tr\u1eef.\n- \u0110\u00e2y l\u00e0 b\u1ea3n c\u0169. N\u1ebfu kh\u00f4ng c\u1ea7n d\u00f9ng m\u1ed9t phi\u00ean b\u1ea3n c\u1ee5 th\u1ec3, h\u00e3y ch\u1ecdn [b\u1ea3n m\u1edbi nh\u1ea5t](https://github.com/tomsuhapbia/latex-studio/releases/latest).\n\n## Ki\u1ec3m tra t\u00ednh to\u00e0n v\u1eb9n\n\nFile **SHA256SUMS.txt** \u0111\u01b0\u1ee3c \u0111\u00ednh k\u00e8m c\u00f9ng b\u1ed9 c\u00e0i. SHA-256 c\u1ee7a `LaTeXStudio-Setup-1.1.0.exe`:\n\n`dbdbd6db3c8ecf6815124e1009f9425263fea6e563d088ab07eb42e611836253`\n\nTrong PowerShell, c\u00f3 th\u1ec3 ki\u1ec3m tra b\u1eb1ng:\n\n```powershell\nGet-FileHash -Algorithm SHA256 -LiteralPath .\\LaTeXStudio-Setup-1.1.0.exe\n```\n\n## H\u1ed7 tr\u1ee3\n\nKhi [b\u00e1o l\u1ed7i](https://github.com/tomsuhapbia/latex-studio/issues), vui l\u00f2ng ghi r\u00f5 phi\u00ean b\u1ea3n **1.1.0**, compiler \u0111ang d\u00f9ng, c\u00e1c b\u01b0\u1edbc t\u00e1i hi\u1ec7n v\u00e0 \u1ea3nh th\u00f4ng b\u00e1o l\u1ed7i. B\u1ecf d\u1eef li\u1ec7u ri\u00eang t\u01b0 tr\u01b0\u1edbc khi g\u1eedi.\n","version":"1.1.0"}]
    steps:
      - name: Correct and verify archived release descriptions
        shell: python
        run: |
          import json, os, subprocess
          items = json.loads(os.environ["NOTES_JSON"])
          repo = "tomsuhapbia/latex-studio"
          for item in items:
              endpoint = "repos/" + repo + "/releases/" + str(item["id"])
              subprocess.run(["gh", "api", endpoint, "--method", "PATCH", "--input", "-"],
                  input=json.dumps({"body": item["body"]}, ensure_ascii=True), text=True, capture_output=True, check=True)
              fetched = subprocess.run(["gh", "api", endpoint], text=True, capture_output=True, check=True)
              release = json.loads(fetched.stdout)
              assert release["tag_name"] == item["tag"]
              body = release["body"]
              assert body.replace("\r\n", "\n") == item["body"]
              assert "\ufffd" not in body and "?" not in body
              print(item["tag"] + ": UTF-8 notes verified", flush=True)
          
